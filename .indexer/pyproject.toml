[project]
name = "rigidity-indexer"
version = "0.1.0"
description = "Tree-sitter + ChromaDB RAG index over .samples/ Lean blueprint projects"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
rigidity-index = "indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]
